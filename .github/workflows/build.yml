name: Build SocialBlocker exe

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Self-test the hosts-file logic
        run: dotnet run --project src/SocialBlocker.Cli -- selftest

      - name: Publish CLI (self-contained single-file exe)
        run: dotnet publish src/SocialBlocker.Cli -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o out/cli

      - name: Publish Service (self-contained single-file exe)
        run: dotnet publish src/SocialBlocker.Service -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o out/service

      - name: Upload built exe files
        uses: actions/upload-artifact@v4
        with:
          name: SocialBlocker-exe
          path: |
            out/cli/socialblocker.exe
            out/service/SocialBlocker.Service.exe
